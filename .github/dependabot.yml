version: 2
updates:
  # Application dependencies (fastapi, uvicorn, prometheus-client, and the
  # test-only tools installed in ci-app.yml).
  - package-ecosystem: pip
    directory: /src/webapp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Every action pinned by SHA across all four workflows — Dependabot opens
  # a PR with the new SHA and the human-readable tag comment updated too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Dockerfile base image (python:3.12-slim, pinned by digest).
  - package-ecosystem: docker
    directory: /src/webapp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
