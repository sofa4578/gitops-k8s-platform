version: 2
updates:
  # app deps
  - package-ecosystem: pip
    directory: /src/webapp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # SHA-pinned actions across all four workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Dockerfile base image digest
  - package-ecosystem: docker
    directory: /src/webapp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
