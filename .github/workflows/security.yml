name: security

# Scheduled + PR-triggered scans that don't fit ci-app (image scanning
# happens there, gated on push) or ci-manifests (manifest policy scanning
# happens there). This workflow specifically catches secrets committed to
# history and filesystem-level vulnerabilities in application code.
"on":
  schedule:
    # Monday 06:00 UTC — new CVEs are published continuously, so a build
    # that was clean last week is not guaranteed clean today.
    - cron: "0 6 * * 1"
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history, not just the merge commit

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: trivy filesystem scan (src/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: src/
          exit-code: "1"
          severity: "CRITICAL"
