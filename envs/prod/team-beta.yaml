# prod overlay for team-beta, values only. Applied by the team-beta-prod Application.

image:
  repository: ghcr.io/sofa4578/webapp
  # placeholder until CI publishes real builds; schema rejects "latest"
  tag: "0.1.0"

# ignored while autoscaling is on; kept as the starting count
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    # limit == request, Guaranteed QoS for memory
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  # drain can't take more than one of the two out at a time
  minAvailable: 2

config:
  appEnv: prod
  # logLevel stays at the chart default

ingress:
  enabled: true
  className: nginx
  host: beta.platform.local
  # issuer stays at the chart default (selfsigned). For real TLS, override
  # cert-manager.io/cluster-issuer here and apply the letsencrypt issuer.
