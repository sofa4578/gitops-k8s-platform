# Dev overlay for team-alpha: values only, no templates (see
# charts/webapp/values.yaml for what each key controls and its default).
# Applied by tenants/team-alpha/applications.yaml (the "team-alpha-dev"
# Application).

image:
  repository: ghcr.io/sofa4578/webapp
  # Pinned, non-"latest" placeholder tag — values.schema.json rejects
  # "latest" outright. Bumped by scripts/ once CI actually publishes builds.
  tag: "0.1.0"

replicaCount: 1

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

config:
  appEnv: dev
  # Dev-only: more verbose logging to make local debugging easier. Prod
  # keeps the chart default ("info") — see envs/prod/team-alpha.yaml.
  logLevel: debug

ingress:
  enabled: true
  className: nginx
  # "-dev" suffix, not just "alpha.platform.local": the prod overlay
  # (envs/prod/team-alpha.yaml) deploys into this SAME namespace (see
  # tenants/team-alpha/applications.yaml) and takes the bare hostname, so
  # dev needs a distinct host to avoid an Ingress collision.
  host: alpha-dev.platform.local
  # cert-manager.io/cluster-issuer stays at the chart default
  # (letsencrypt-staging) for now; platform/cert-manager/issuers/ (a later
  # phase) introduces the local self-signed ClusterIssuer this should
  # actually point at for a kind cluster.
