# dev overlay for team-beta, values only. Applied by the team-beta-dev Application.

image:
  repository: ghcr.io/sofa4578/webapp
  # placeholder until CI publishes real builds; schema rejects "latest"
  tag: "0.1.0"

replicaCount: 1

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

config:
  appEnv: dev
  # dev only, prod keeps the chart default
  logLevel: debug

ingress:
  enabled: true
  className: nginx
  # -dev suffix: prod shares this namespace and takes the bare hostname
  host: beta-dev.platform.local
  # issuer stays at the chart default (selfsigned). For real TLS, override
  # cert-manager.io/cluster-issuer here and apply the letsencrypt issuer.
