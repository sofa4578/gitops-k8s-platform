# Defaults for the webapp chart. Every tenant overrides a subset via envs/.

image:
  # no default — every consumer sets its own, schema rejects empty
  repository: ""
  # schema rejects "latest"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  # empty = derive from fullname
  name: ""

# only used when autoscaling is off, see deployment.yaml
replicaCount: 1

# rendered into configmap.yaml, hashed into the pod annotation
config:
  appEnv: local
  logLevel: info

# extra container env, full EnvVar structs:
#   env:
#     - name: FEATURE_FLAG_X
#       value: "true"
env: []

# memory limit == request for Guaranteed QoS; cpu limit higher since
# throttling beats never bursting
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 128Mi

# off by default, prod tenants turn it on
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  behavior:
    scaleDown:
      # 5min window so a brief dip doesn't scale down then straight back up
      stabilizationWindowSeconds: 300

ingress:
  enabled: false
  className: nginx
  host: webapp.example.com
  annotations:
    # matches platform/cert-manager/issuers/selfsigned.yaml; override per-env
    # to letsencrypt-staging/prod for real TLS
    cert-manager.io/cluster-issuer: selfsigned
  tls:
    enabled: true
    # empty = <fullname>-tls
    secretName: ""

podDisruptionBudget:
  # off by default — a 1-replica dev deploy can't satisfy minAvailable 2
  enabled: false
  minAvailable: 2

networkPolicy:
  # off by default so the chart works in a namespace without the ingress-nginx label
  enabled: false

# platform baseline, exposed so a consumer can loosen a single field if needed
securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  container:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

nodeSelector: {}

tolerations: []

affinity: {}
