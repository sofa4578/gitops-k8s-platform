{{- if .Values.serviceAccount.create }}
# Dedicated, token-less identity: the app has no reason to call the
# Kubernetes API, so automountServiceAccountToken is false rather than
# relying on RBAC alone to keep it powerless (RBAC level 1 from blueprint
# section 11 — the app's own ServiceAccount carries zero permissions).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webapp.serviceAccountName" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
