{{- if .Values.podDisruptionBudget.enabled }}
# Bounds voluntary disruption (node drain, cluster-autoscaler consolidation)
# separately from involuntary failures — kubectl drain blocks the eviction
# until enough replacement pods are Ready, instead of taking the whole
# workload down at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "webapp.selectorLabels" . | nindent 6 }}
{{- end }}
