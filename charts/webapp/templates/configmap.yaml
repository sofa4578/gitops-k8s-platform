# App configuration, kept small and non-secret on purpose: anything that
# needs to stay out of git (credentials, tokens) is a SealedSecret, never a
# key here. deployment.yaml hashes this file into a checksum/config pod
# annotation so a config-only change still triggers a rolling restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
