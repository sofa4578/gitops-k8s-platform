# restricts what Applications scoped to this project can sync
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-beta
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  description: Tenant project for team-beta
  sourceRepos:
    - https://github.com/sofa4578/gitops-k8s-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: team-beta
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
