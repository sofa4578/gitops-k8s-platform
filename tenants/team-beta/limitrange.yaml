# stops an unconfigured pod (kubectl run) eating the whole quota.
# values match charts/webapp/values.yaml defaults
apiVersion: v1
kind: LimitRange
metadata:
  name: team-beta
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 128Mi
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 512Mi
