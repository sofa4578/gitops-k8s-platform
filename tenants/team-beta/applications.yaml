# dev and prod in the same namespace, different release names
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-beta-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # project: team-beta, not default — this is what makes appproject.yaml bind
  project: team-beta
  source:
    repoURL: https://github.com/sofa4578/gitops-k8s-platform.git
    targetRevision: main
    path: charts/webapp
    helm:
      valueFiles:
        - ../../envs/dev/team-beta.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: team-beta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-beta-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: team-beta
  source:
    repoURL: https://github.com/sofa4578/gitops-k8s-platform.git
    targetRevision: main
    path: charts/webapp
    helm:
      valueFiles:
        - ../../envs/prod/team-beta.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: team-beta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
