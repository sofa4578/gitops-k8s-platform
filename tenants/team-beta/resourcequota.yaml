# sized for prod at maxReplicas 6 + dev's 1, plus headroom for debug pods
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-beta
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 3Gi
    count/pods: "20"
    # no tenant LoadBalancers, ingress-nginx is the only entry point.
    # note: special-cased key, not count/ prefixed
    services.loadbalancers: "0"
