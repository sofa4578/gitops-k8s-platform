# Pod Security Admission labels enforce the "restricted" profile at the
# namespace level — this is a control-plane guarantee, not something a pod
# spec can opt out of, unlike the Helm chart's securityContext defaults
# (which a consumer could in principle loosen in its own values file).
apiVersion: v1
kind: Namespace
metadata:
  name: team-alpha
  annotations:
    # wave -2: the namespace must exist before anything namespace-scoped
    # (ResourceQuota, LimitRange, NetworkPolicy, RBAC — all wave 2) can be
    # applied into it, and well before the tenant Applications (wave 3) ask
    # Argo CD to sync workloads there.
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
