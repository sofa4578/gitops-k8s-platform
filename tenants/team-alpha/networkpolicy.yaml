# Three policies, applied together, that make this namespace deny-by-default
# and then re-open exactly the traffic a tenant needs. See
# docs/troubleshooting.md for the single most common mistake made with this
# file: applying default-deny-all without allow-dns-egress leaves pods
# Running but every DNS lookup (including Service DNS) hangs until timeout.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: team-alpha
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-nginx
  namespace: team-alpha
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: team-alpha
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # trap #4: BOTH protocols. UDP 53 is the common case, but resolvers fall
    # back to TCP 53 for answers too large for a single UDP datagram (e.g. a
    # Service with many endpoints) — allow only UDP and that fallback query
    # times out exactly the same way a fully-missing rule would.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
