# strategic merge onto upstream argocd-cm, only the keys below change
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  # no namespace — patch matching runs before the namespace transformer
data:
  # annotations don't get copied by webhooks the way labels do
  application.resourceTrackingMethod: annotation
  # high-churn objects Argo CD has no reason to track
  resource.exclusions: |
    - apiGroups:
        - "coordination.k8s.io"
      kinds:
        - "Lease"
      clusters:
        - "*"
    - apiGroups:
        - ""
        - "discovery.k8s.io"
      kinds:
        - "Endpoints"
        - "EndpointSlice"
      clusters:
        - "*"
