apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # two sources: platform/ for infrastructure, tenants/ for isolation policies
  # and app Applications
  sources:
    - repoURL: https://github.com/sofa4578/gitops-k8s-platform.git
      targetRevision: main
      path: platform
      directory:
        recurse: true
    - repoURL: https://github.com/sofa4578/gitops-k8s-platform.git
      targetRevision: main
      path: tenants
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
