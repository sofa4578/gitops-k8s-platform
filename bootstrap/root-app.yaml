apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Two directory sources instead of a single `path: platform`: tenant
  # AppProject/RBAC/ResourceQuota/NetworkPolicy (wave 2) and the tenant webapp
  # Applications (wave 3) live under tenants/, not platform/, so root must also
  # recurse tenants/ to reconcile them. charts/, envs/, scripts/, docs/, kind/,
  # bootstrap/, src/ and .github/ hold Helm chart sources, values-only files or
  # CI config — not raw manifests — and stay out of both recursive sources.
  sources:
    - repoURL: https://github.com/sofa4578/gitops-k8s-platform.git
      targetRevision: main
      path: platform
      directory:
        recurse: true
    - repoURL: https://github.com/sofa4578/gitops-k8s-platform.git
      targetRevision: main
      path: tenants
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
