# minimal kube-prometheus-stack overrides — enough to show platform health,
# not a real observability stack

alertmanager:
  # nothing to route alerts to locally
  enabled: false

prometheusOperator:
  admissionWebhooks:
    # The certgen hook job patches caBundle into the webhook configs in-cluster,
    # but git has it empty, so selfHeal wipes it every reconcile and the
    # apiserver then rejects the operator's cert ("tls: bad certificate").
    # The webhook only syntax-checks PrometheusRule/AlertmanagerConfig, which
    # isn't worth that drift loop here.
    enabled: false
  tls:
    # no webhook to serve, so no serving cert to manage either
    enabled: false

prometheus:
  prometheusSpec:
    # local cluster, gets torn down anyway
    retention: 6h
    # no PVC, operator falls back to emptyDir
    storageSpec: {}

grafana:
  # admin password is chart-generated into the monitoring-grafana secret:
  #   kubectl -n monitoring get secret monitoring-grafana \
  #     -o jsonpath='{.data.admin-password}' | base64 -d
  persistence:
    enabled: false
