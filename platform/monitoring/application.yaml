apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  # no sync-wave, nothing depends on it either way
spec:
  project: default
  # multi-source: upstream chart + values from this repo, so values stay
  # reviewable in PRs instead of inlined as a string
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.6.2
      helm:
        valueFiles:
          - $values/platform/monitoring/values.yaml
    - repoURL: https://github.com/sofa4578/gitops-k8s-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # The grafana chart generates a random admin password on every render, so
  # without these the Secret is permanently OutOfSync and selfHeal rolls the
  # grafana pod every reconcile — with a new password each time.
  # Proper fix is grafana.admin.existingSecret backed by a SealedSecret
  # (see docs/security.md); until then let the in-cluster password stand.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: monitoring-grafana
      namespace: monitoring
      jsonPointers:
        - /data/admin-password
    - group: apps
      kind: Deployment
      name: monitoring-grafana
      namespace: monitoring
      jqPathExpressions:
        - '.spec.template.metadata.annotations."checksum/secret"'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # SSA: kube-prometheus CRDs blow the client-side annotation limit
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # without this a single failed sync wedges auto-sync until a new commit
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
