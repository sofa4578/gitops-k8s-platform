apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    # wave 0: no CRDs of its own, but the HPA on the tenant webapp (wave 3)
    # needs the metrics.k8s.io API available to compute desired replicas
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      values: |
        # --kubelet-insecure-tls: kind's kubelet serving certificate is not
        # signed by a CA metrics-server trusts, so the default TLS verification
        # fails and metrics-server CrashLoopBackOffs. Acceptable ONLY for local
        # kind development — a real cluster must present a properly signed
        # kubelet certificate instead of disabling verification.
        args:
          - --kubelet-insecure-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
