# selfSigned issuer -> one CA cert -> ca issuer that signs tenant certs.
# One CA to import locally instead of one per hostname:
#   kubectl get secret webapp-ca -n cert-manager -o jsonpath='{.data.tls\.crt}' | base64 -d
# wave 1 everywhere here: cert-manager CRDs land at wave -1
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webapp-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  isCA: true
  commonName: gitops-k8s-platform-local-ca
  secretName: webapp-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ca:
    secretName: webapp-ca
