# OPTIONAL — for the public demo path only (not part of the default local
# kind bootstrap). See docs/bootstrap.md. DNS-01 can't complete on plain kind.
#
# Token comes from a SealedSecret, never from this file:
#   scripts/seal-secret.sh cert-manager cloudflare-api-token-secret api-token=<token>
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    # wave 1, after cert-manager CRDs
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    # staging first — prod rate limit is 50 certs/domain/week. Switch to
    # acme-v02.api.letsencrypt.org once this issues end to end.
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: sofiia@example.invalid  # TODO(sofiia): replace with a real contact address before public use
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            email: sofiia@example.invalid  # TODO(sofiia): must match the Cloudflare account that owns the token below
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
