# OPTIONAL — for the public demo path only (Cloudflare Tunnel or a small VM
# with a real domain), not part of the default local kind bootstrap. See
# docs/bootstrap.md for when/why you'd apply this at all; on a plain kind
# cluster this issuer will never successfully complete a DNS-01 challenge
# (there's no public DNS zone to answer it), so leaving it unsynced is fine.
#
# The Cloudflare API token below is never a plaintext value — it is expected
# to already exist as the Secret named "cloudflare-api-token-secret" in the
# cert-manager namespace, created as a SealedSecret via scripts/seal-secret.sh
# (e.g. scripts/seal-secret.sh cert-manager cloudflare-api-token-secret
# api-token=<real-token>) and committed separately. This file only references
# that secret's key by name; it never contains the token itself.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    # wave 1, same reasoning as selfsigned.yaml: must come after cert-manager's
    # CRDs (wave -1).
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    # Let's Encrypt's staging endpoint on purpose: its rate limits are far
    # looser than production, so iterating on DNS-01 wiring doesn't risk
    # hitting the production "50 certificates per domain per week" limit.
    # Switch server to https://acme-v02.api.letsencrypt.org/directory (and
    # rename this issuer to letsencrypt-prod) only once staging issues
    # successfully end to end.
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: sofiia@example.invalid  # TODO(sofiia): replace with a real contact address before public use
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            email: sofiia@example.invalid  # TODO(sofiia): must match the Cloudflare account that owns the token below
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
