# kind cluster config for the local GitOps platform.
# Three nodes: with only one node, PodDisruptionBudgets and
# topologySpreadConstraints have nothing to demonstrate and podAntiAffinity
# can never be satisfied. Two workers are the minimum on which those
# mechanisms are actually visible.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-platform
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # kind runs inside Docker, so without an explicit port mapping the
    # ingress-nginx controller is unreachable from the host. This is the
    # most common cause of "ingress does not work" on kind.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
