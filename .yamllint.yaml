# yamllint config — see https://yamllint.readthedocs.io/en/stable/configuration.html
extends: default

rules:
  # most manifests here are single-doc, no leading ---
  document-start: disable
  # warn, don't fail — k8s specs run long
  line-length:
    max: 200
    level: warning
  trailing-spaces: enable
  new-line-at-end-of-file: enable

ignore: |
  # vendored chart deps
  charts/**/charts/
  *.tgz
  # Go template directives aren't valid YAML; helm lint covers these
  charts/**/templates/
